<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вікторина</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1>Вікторина</h1>
        <nav>
            <a href="#questions">Питання</a>
            <a href="#results">Результати</a>
        </nav>
    </header>

    <main>
        <!-- Ділянку «питання + прогрес» тепер малює React-компонент App -->
        <div id="quiz-root"></div>


        <!-- Блок результатів спроб -->
        <section id="results">
            <h2>Історія спроб</h2>
            <ul class="results-grid">
                <li>
                    <article class="card">
                        <div>
                            <h3>Спроба 1</h3>
                            <p class="date">Дата: 15.09.2026</p>
                        </div>
                        <p class="badge">Результат: 3/5</p>
                    </article>
                </li>
                <li>
                    <article class="card">
                        <div>
                            <h3>Спроба 2</h3>
                            <p class="date">Дата: 03.10.2026</p>
                        </div>
                        <p class="badge">Результат: 5/5</p>
                    </article>
                </li>
                <li>
                    <article class="card">
                        <div>
                            <h3>Спроба 3</h3>
                            <p class="date">Дата: 03.10.2026</p>
                        </div>
                        <p class="badge">Результат: 4/5</p>
                    </article>
                </li>
            </ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Вікторина. Всі права захищені. Авторство: ІП-52 Хитрич Іван</p>
    </footer>

    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
    <script type="text/babel" src="js/app.js"></script>
</body>

</html>
